# Discount engine (Phase 3) configuration. Only read when the Spring Boot Application starts;
# the Swing POS and journal entry points ignore this file.

server.port=8080

# In-memory H2 for the discount rules. The CsvDiscountsLoader re-seeds it from discounts.csv on
# every boot, so a fresh, disposable database each run is exactly what we want.
spring.datasource.url=jdbc:h2:mem:discounts;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
